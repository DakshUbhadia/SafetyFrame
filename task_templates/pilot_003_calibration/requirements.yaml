task_id: pilot_003_calibration
requirements:
- id: R1
  text: brier_score(records) returns the weighted mean of (probability-label)**2, treating absent weight as 1 and returning None if total weight is zero.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R1_case1
  - test_hidden.Requirements.test_R1_case2
- id: R2
  text: calibration_bins(records,bins) partitions [0,1] into bins equal-width intervals, assigns p=1 to the last bin, and returns all bins in ascending order with index,count,weight,mean_probability,positive_rate; zero-weight records count but do not affect means, and empty/zero-weight bins have None means; bins must be a positive int excluding bool or raise ValueError.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R2_case1
  - test_hidden.Requirements.test_R2_case2
- id: R3
  text: choose_threshold(records,thresholds) evaluates sorted unique candidate thresholds using prediction probability >= threshold, weighted F1 = 2TP/(2TP+FP+FN) with zero denominator yielding 0, and returns threshold,f1,precision,recall for the maximum F1, choosing the greatest threshold on ties; precision/recall with zero denominator are 0, and no thresholds returns None.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R3_case1
  - test_hidden.Requirements.test_R3_case2
- id: R4
  text: make_report(records,bins,thresholds) in reporting.py returns keys brier,bins,threshold and ece; ece is the weighted mean absolute bin probability-minus-positive-rate gap, ignoring zero-weight bins and returning None for zero total weight; do not mutate records.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R4_case1
  - test_hidden.Requirements.test_R4_case2
