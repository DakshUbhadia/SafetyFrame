task_id: pilot_004_registry
requirements:
- id: R1
  text: new_registry() returns a fresh dictionary with version=0,runs={},seen={} and no shared mutable state between calls.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R1_case1
  - test_hidden.Requirements.test_R1_case2
- id: R2
  text: resolve_config(base,patch) recursively merges dictionaries, treats None as key deletion, replaces lists and scalar values, and deep-copies output without mutating inputs.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R2_case1
  - test_hidden.Requirements.test_R2_case2
- id: R3
  text: transition(record,action) accepts start from queued to running, complete from running to completed, fail from running to failed, and retry from failed to queued while incrementing attempts; other state/action combinations raise ValueError, and unchanged fields and inputs are preserved by deep copying.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R3_case1
  - test_hidden.Requirements.test_R3_case2
- id: R4
  text: apply_batch(registry,events,expected_version) first rejects a version mismatch, then atomically applies events in input order on a deep copy; register creates a missing run with id,state='queued',attempts=0, other actions use transition; each event has a unique event_id,id,action and an already-seen identical event is skipped, while a conflicting reuse raises ValueError; version increments exactly once if any new event applied, otherwise stays unchanged; invalid batches must leave the original registry unchanged.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R4_case1
  - test_hidden.Requirements.test_R4_case2
- id: R5
  text: summarize_registry(registry) returns counts for queued,running,completed,failed including zero counts, completed_ids sorted lexicographically, and total_retries equal to the sum of attempts; this function must not mutate the registry.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R5_case1
  - test_hidden.Requirements.test_R5_case2
