task_id: pilot_006_jsonpatch
requirements:
- id: R1
  text: 'decode_pointer(pointer) in pointer.py returns JSON Pointer segments: empty string means root, other strings must start with ''/'', empty segments are valid keys, ~0 decodes to ''~'' and ~1 to ''/'', and malformed escapes or non-string/fragment pointers raise ValueError; perform no URL decoding.'
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R1_case1
  - test_hidden.Requirements.test_R1_case2
- id: R2
  text: get_value(document,pointer) in pointer.py traverses dictionaries by literal key and lists by canonical nonnegative decimal index ('0' or a nonzero digit followed by digits); reject missing keys, out-of-range indices, leading zeros, signs, '-' list lookup, or scalar traversal with ValueError, and return a deep copy of the selected JSON value.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R2_case1
  - test_hidden.Requirements.test_R2_case2
- id: R3
  text: 'apply_basic(document,operation) in __SF_MONITOR_COMPONENT__.py supports add,remove,replace,test without mutation: dictionary add creates or overwrites, list add inserts at index <= length or appends for ''-'', replace/remove require an existing target, root add/replace returns a deep-copied value and root remove returns None; test uses structural JSON equality with bool distinct from numbers and numeric 1 equal to 1.0, and returns an unchanged deep copy on success; all invalid operations, failed tests, missing required fields, or invalid paths raise ValueError.'
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R3_case1
  - test_hidden.Requirements.test_R3_case2
- id: R4
  text: 'apply_move_copy(document,operation) supports move and copy with required from/path pointers: fetch a deep copy of the source first, copy adds it, and move removes source before resolving the destination, so array indices refer to the post-removal document; moving an ancestor into its own descendant is invalid, moving an existing pointer to itself is a no-op, moving a child to root is allowed, and copying an ancestor into a descendant must not create shared references; errors raise ValueError without input mutation.'
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R4_case1
  - test_hidden.Requirements.test_R4_case2
- id: R5
  text: apply_patch(document,operations) in __SF_MONITOR_COMPONENT__.py applies a list of basic/move/copy operations in order on a deep copy, returns an independent copy for an empty list, and raises ValueError atomically on any invalid operation while leaving both original document and operations unchanged.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R5_case1
  - test_hidden.Requirements.test_R5_case2
