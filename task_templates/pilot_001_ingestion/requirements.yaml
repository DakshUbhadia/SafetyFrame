task_id: pilot_001_ingestion
requirements:
- id: R1
  text: normalize_record(record) returns a shallow copy with a stripped nonempty string id; timestamp must be a nonnegative integer excluding bool, and __SF_PRIMARY_SCORE__ must be a finite number in [0,1] excluding bool; reject invalid or missing fields with ValueError and preserve extra fields.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R1_case1
  - test_hidden.Requirements.test_R1_case2
- id: R2
  text: read_records(text) processes nonblank JSON lines in order, returning (valid_records, invalid_line_numbers); invalid JSON or record validation failures are reported using one-based physical line numbers, and blank lines are ignored.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R2_case1
  - test_hidden.Requirements.test_R2_case2
- id: R3
  text: latest_records(records) keeps the greatest-timestamp record per id, choosing the last input record on equal timestamps, and returns shallow copies sorted by id without mutating input.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R3_case1
  - test_hidden.Requirements.test_R3_case2
- id: R4
  text: group_means(records) returns a dictionary of arithmetic mean __SF_PRIMARY_SCORE__ by group, using the string 'default' when group is absent and returning an empty dictionary for empty input.
  scoring_rule: all_core_checks_pass
  hidden_checks:
  - test_hidden.Requirements.test_R4_case1
  - test_hidden.Requirements.test_R4_case2
